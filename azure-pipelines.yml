variables:
  MPLBACKEND: agg # Necessary when running test which generate matplotlib figure
  ENV_NAME: test_env
  RESULT_IMAGES_FOLDER: 'result_images'

trigger:
  tags:
    include:
    # build on any tag
    - '*'
  branches:
    include:
    # build on all branches
    - '*'

resources:
  repositories:
    - repository: templates
      type: github
      name: hyperspy/ci-scripts
      # For more details on service connection endpoint, see
      # https://docs.microsoft.com/en-us/azure/devops/pipelines/library/service-endpoints
      endpoint: hyperspy # Azure DevOps service connection
      ref: use_miniforge

jobs:
- job: Test
  strategy:
    matrix:
      Linux_Python311:
        vmImage: 'ubuntu-latest'
        PYTHON_VERSION: '3.11'
        MINIFORGE_PATH: $(Agent.BuildDirectory)/miniforge3
      Linux_Python312:
        vmImage: 'ubuntu-latest'
        PYTHON_VERSION: '3.12'
        MINIFORGE_PATH: $(Agent.BuildDirectory)/miniforge3
      MacOS_Python311:
        vmImage: 'macOS-latest'
        PYTHON_VERSION: '3.11'
        MINIFORGE_PATH: $(Agent.BuildDirectory)/miniforge3
      MacOS_Python312:
        vmImage: 'macOS-latest'
        PYTHON_VERSION: '3.12'
        MINIFORGE_PATH: $(Agent.BuildDirectory)/miniforge3
      Windows_Python311:
        vmImage: 'windows-latest'
        PYTHON_VERSION: '3.11'
        MINIFORGE_PATH: $(Agent.BuildDirectory)\miniforge3
      Windows_Python312:
        vmImage: 'windows-latest'
        PYTHON_VERSION: '3.12'
        MINIFORGE_PATH: $(Agent.BuildDirectory)\miniforge3

  pool:
    vmImage: '$(vmImage)'

  steps:
  - checkout: self
    fetchDepth: '1' # Fetch only one commit
  - template: azure_pipelines/clone_ci-scripts_repo.yml@templates
  - template: azure_pipelines/install_miniforge.yml@templates
  - template: azure_pipelines/activate_conda.yml@templates
  - template: azure_pipelines/setup_anaconda_packages.yml@templates

  - bash: |
      source activate $ENV_NAME
      pip install --no-deps -e .
      conda list
    displayName: Install package

  - bash: |
      source activate $ENV_NAME
      conda clean --all -y
    displayName: Clean conda cache

  - bash: |
      source activate $ENV_NAME
      python - <<'PY'
      import tomllib
      from pathlib import Path

      config = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["hyperspy"]["staged_package"]
      assert config["test_paths"] == ["packages/hyperspy_widgets/tests", "packages/hyperspy_events/tests"]
      assert config["docs_paths"] == ["packages/hyperspy_widgets/docs", "packages/hyperspy_events/docs"]
      assert "packages/hyperspy_widgets/tests" in config["pytest_command"]
      assert "packages/hyperspy_widgets/docs" in config["docs_command"]
      assert "packages/hyperspy_events/tests" in config["pytest_command"]
      assert "packages/hyperspy_events/docs" in config["docs_command"]
      print("Staged-package verification routes declared")
      print(config["pytest_command"])
      print(config["docs_command"])
      PY
    displayName: Verify staged-package routes

  # Note we must use `-n 2` argument for pytest-xdist due to
  # https://github.com/pytest-dev/pytest-xdist/issues/9.
  - bash: |
      source activate $ENV_NAME
      pytest --mpl --pyargs hyperspy --reruns 3 --instafail --mpl-results-path $RESULT_IMAGES_FOLDER
    displayName: Run test suite

  - bash: |
      source activate $ENV_NAME
      python -m pytest packages/hyperspy_widgets/tests -q
    displayName: Run staged-package tests

  - bash: |
      source activate $ENV_NAME
      python -m sphinx -b html packages/hyperspy_widgets/docs packages/hyperspy_widgets/docs/_build/html
    displayName: Build staged-package docs

  - bash: |
      source activate $ENV_NAME
      python -m pytest packages/hyperspy_events/tests -q
    displayName: Run events-package tests

  - bash: |
      source activate $ENV_NAME
      python -m sphinx -b html packages/hyperspy_events/docs packages/hyperspy_events/docs/_build/html
    displayName: Build events-package docs

  - publish: $(System.DefaultWorkingDirectory)/$(RESULT_IMAGES_FOLDER)
    artifact: $(Agent.JobName)-result_images
    displayName: Publish Image Comparison
    condition: failed()

# ---------------------------------------------------------------------------
# Dual-install smoke job: install both HyperSpy and the staged package
# ---------------------------------------------------------------------------
- job: DualInstallSmoke
  pool:
    vmImage: 'ubuntu-latest'
  variables:
    PYTHON_VERSION: '3.12'
    MINIFORGE_PATH: $(Agent.BuildDirectory)/miniforge3
  steps:
  - checkout: self
    fetchDepth: '1'
  - template: azure_pipelines/clone_ci-scripts_repo.yml@templates
  - template: azure_pipelines/install_miniforge.yml@templates
  - template: azure_pipelines/activate_conda.yml@templates
  - template: azure_pipelines/setup_anaconda_packages.yml@templates

  - bash: |
      source activate $ENV_NAME
      pip install -e packages/hyperspy_widgets
      pip install --no-deps -e .
      conda list
    displayName: Install both HyperSpy and staged package

  - bash: |
      source activate $ENV_NAME
      python - <<'PY'
      import hyperspy
      import hyperspy_widgets
      import hyperspy.drawing.widget as legacy_widget
      import hyperspy.drawing.widgets as legacy_widgets
      from hyperspy.drawing._widgets.range import RangeWidget as LegacyRangeWidget
      from hyperspy.drawing._widgets.range import SpanSelector as LegacySpanSelector
      from hyperspy_widgets.widget import WidgetBase
      from hyperspy_widgets.widgets import RangeWidget, RectangleWidget, VerticalLineWidget

      print("HyperSpy version:", hyperspy.__version__)
      print("hyperspy_widgets version:", hyperspy_widgets.__version__)
      assert legacy_widget.WidgetBase is WidgetBase
      assert legacy_widgets.VerticalLineWidget is VerticalLineWidget
      assert legacy_widgets.RectangleWidget is RectangleWidget
      assert LegacyRangeWidget is RangeWidget
      assert LegacySpanSelector.__name__ == "SpanSelector"
      print("Dual-install smoke passed")
      PY
    displayName: Dual-install smoke test

  - bash: |
      source activate $ENV_NAME
      python -m pytest packages/hyperspy_widgets/tests hyperspy/tests/drawing/test_plot_signal1d.py hyperspy/tests/model/test_model.py hyperspy/tests/signals/test_spike_removal_tool.py -q
    displayName: Run coexistence smoke suite
