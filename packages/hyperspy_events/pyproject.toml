[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperspy-events"
version = "0.0.0"
description = "Event system for HyperSpy — standalone event-driven programming primitives"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "The HyperSpy Community"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/hyperspy/hyperspy"
Source = "https://github.com/hyperspy/hyperspy"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
